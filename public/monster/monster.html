<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster_Glitch</title>


    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.dom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>


    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 16px;
        }

        #value-verification {
            margin-top: 8px;
            color: #444;
        }

        #canvasContainer {
            position: relative;
            display: inline-block;
            /* wraps to canvas size */
        }

        /* p5 canvas should be block so overlay aligns */
        #canvasContainer canvas {
            display: block;
        }

        /* the QR overlay */
        #qrOverlay {
            position: absolute;
            right: 20px;
            /* tweak placement */
            bottom: 20px;
            /* tweak placement */
            width: 220px;
            height: 220px;
            padding: 10px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            display: none;
            /* hidden until generated */
            z-index: 10;
        }

        /* make the QR itself fill */
        #qrOverlay img {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* When container is fullscreen */
        #canvasContainer:fullscreen {
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            background: #000;
            /* matches your fullscreen BG */
        }

        /* Scale canvas to fit the screen while preserving aspect ratio */
        #canvasContainer:fullscreen canvas {
            width: auto !important;
            height: auto !important;
            max-width: 100vw;
            max-height: 100vh;
        }

        /* Keep QR pinned in fullscreen */
        #canvasContainer:fullscreen #qrOverlay {
            width: 90px;
            height: 90px;
            right: 84.5%;
            transform: translateX(50%);
            bottom: 300px;
        }
    </style>

</head>

<body>
    <h1>Monster Score Screen</h1>
    <button onclick="createMonster()">Complete</button>
    <!-- only include p5.sound if you actually use it -->
    <!-- <script src="libraries/p5.sound.min.js"></script> -->

    <div id="canvasContainer">
        <!-- p5 will insert the canvas here -->
        <div id="qrOverlay"></div>
    </div>


    <script src="../modules/helpers/fullscreen.js"></script>
    <script src="../modules/helpers/pngAnimation.js"></script>
    <script src="monster.js"></script>

    <!--<div id="qrCode" style="margin-top:12px;"></div>-->

</body>

</html>
